<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">El Mostafa Belayd — Junior Full-Stack Developer</title>
  <desc id="desc">A luxury dark portfolio card in Italian Roast and Camel Coat, with an EM monogram, refined editorial serif typography, and a code visual. React, Laravel, REST APIs. Fès, Morocco.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C6B39A"/><stop offset="1" stop-color="#E8D8C4"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8D3A3C" stop-opacity=".3"/><stop offset="1" stop-color="#8D3A3C" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0v50" fill="none" stroke="#C6B39A" stroke-opacity=".04"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#280B0F"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="950" cy="315" rx="450" ry="400" fill="url(#glow)"/>
  <rect x="38" y="38" width="1124" height="554" rx="20" fill="none" stroke="#C6B39A" stroke-opacity=".18"/>
  <g font-family="Georgia, serif">
    <text x="82" y="112" fill="#FAF5EF" font-size="38" font-weight="700" letter-spacing="-1">EM<tspan fill="#C6B39A">.</tspan></text>
    <text x="1119" y="103" fill="#C6B39A" font-family="monospace" font-size="14" text-anchor="end" letter-spacing="2">EDITORIAL DEVELOPER PORTFOLIO / 2026</text>
    <text x="82" y="219" fill="#C6B39A" font-size="15" font-family="monospace" letter-spacing="3">EL MOSTAFA BELAYD</text>
    <text x="77" y="295" fill="#FAF5EF" font-size="64" font-weight="600" letter-spacing="-1.5">Building complete</text>
    <text x="77" y="373" fill="url(#accent)" font-size="64" font-weight="600" letter-spacing="-1.5">web experiences.</text>
    <text x="82" y="431" fill="#C6B39A" font-size="22" font-family="sans-serif">Junior Full-Stack Web Developer</text>
    <g font-size="15" font-family="monospace" fill="#FAF5EF">
      <rect x="82" y="474" width="96" height="36" rx="8" fill="#3B1319" stroke="#C6B39A" stroke-opacity=".3"/><text x="105" y="498">React</text>
      <rect x="189" y="474" width="115" height="36" rx="8" fill="#3B1319" stroke="#C6B39A" stroke-opacity=".3"/><text x="212" y="498">Laravel</text>
      <rect x="315" y="474" width="135" height="36" rx="8" fill="#3B1319" stroke="#C6B39A" stroke-opacity=".3"/><text x="336" y="498">REST APIs</text>
    </g>
    <g transform="translate(782 195) rotate(-4 165 130)">
      <rect x="12" y="16" width="312" height="246" rx="14" fill="#180407" opacity=".7"/>
      <rect width="312" height="246" rx="14" fill="#341016" stroke="#C6B39A" stroke-opacity=".25"/>
      <path d="M0 43h312" stroke="#C6B39A" stroke-opacity=".15"/>
      <circle cx="21" cy="22" r="4" fill="#8D3A3C"/><circle cx="36" cy="22" r="4" fill="#C6B39A"/><circle cx="51" cy="22" r="4" fill="#7B694E"/>
      <text x="293" y="27" text-anchor="end" fill="#C6B39A" font-family="monospace" font-size="11">developer.ts</text>
      <g font-family="monospace" font-size="14">
        <text x="23" y="84" fill="#8D3A3C">const <tspan fill="#FAF5EF">developer = {</tspan></text>
        <text x="39" y="116" fill="#C6B39A">frontend: <tspan fill="#FAF5EF">'React.js'</tspan>,</text>
        <text x="39" y="148" fill="#C6B39A">backend: <tspan fill="#FAF5EF">'Laravel'</tspan>,</text>
        <text x="39" y="180" fill="#C6B39A">location: <tspan fill="#FAF5EF">'Morocco'</tspan></text>
        <text x="23" y="213" fill="#FAF5EF">};</text>
      </g>
    </g>
    <path d="M82 552h1036" stroke="#C6B39A" stroke-opacity=".15"/>
    <text x="82" y="579" fill="#C6B39A" font-size="14" font-family="sans-serif">Fès, Morocco</text>
    <text x="1118" y="579" fill="#C6B39A" font-family="monospace" font-size="13" text-anchor="end" letter-spacing="2">INTERFACES + APIs + PURPOSE</text>
