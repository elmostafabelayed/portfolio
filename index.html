      body { margin: 0; }
      noscript { display: block; padding: 2rem; font: 1rem/1.7 system-ui, sans-serif; }
      noscript a { color: inherit; }
    </style>
    <script>
      (() => {
        let theme = 'dark';
        try {
          const saved = localStorage.getItem('em-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (_) { /* A restricted storage setting keeps the default theme. */ }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#FAF6F0' : '#280B0F');
      })();
    </script>
